name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize] # Runs on new PRs and new pushed commits

permissions:
  contents: read          # Allows Claude to read the files
  pull-requests: write    # Allows Claude to post review comments
  issues: write           # Allows Claude to manage discussion logs
  id-token: write         # Required for secure OIDC token exchange

jobs:
  review:
    name: AI Review Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so Claude can see diffs properly

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          # Your stored subscription OAuth/API token
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Instruct Claude on how to behave during the review
          direct_prompt: |
            You are a senior staff engineer performing a Pull Request review.
            Analyze the changes in this PR and focus heavily on:
            1. Logic bugs or edge-case failures.
            2. High-impact security vulnerabilities (OWASP top 10 flaws).
            3. Obvious performance bottlenecks.

            Keep your feedback concise. Do not leave nit-picky comments regarding
            code style, formatting, or missing comments. If the code looks great,
            simply reply with a positive summary and sign off with an approval.
